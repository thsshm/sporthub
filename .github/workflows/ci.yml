name: CI

# Garde-fou complémentaire à Vercel : si Vercel skip un check (rare mais arrive),
# on est sûrs que typecheck + lint tournent quand même avant le merge.
#
# - Pull request : typecheck + lint sur la branche
# - Push main    : pareil + cache pnpm partagé
# - Merge group  : la merge queue re-teste chaque PR rebasée sur le résultat des
#   précédentes ; sans ce trigger, le check requis ne tournerait jamais sur le
#   groupe et les PR resteraient bloquées dans la file.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

# Annule les jobs en cours quand un nouveau commit arrive sur la même PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 nécessite Node ≥ 22.13
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrations gate (numérotation séquentielle + zéro doublon)
        run: node scripts/check-migrations.mjs

      - name: i18n gate (couverture familles/sports + parité locales)
        run: node scripts/check-i18n.mjs

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm exec next lint --max-warnings 0

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Python scripts self-test
        run: |
          python3 scripts/backfill_courts_count.py --self-test
          python3 scripts/import_v1.py --self-test
          python3 scripts/cluster_clubs.py --self-test
          python3 scripts/backfill_family_null_sport.py --self-test
          python3 scripts/backfill_courts_count_rest.py --self-test
          python3 scripts/import_overture.py --self-test
          python3 scripts/etl_upsert.py --self-test
          python3 scripts/etl/osm_import.py --self-test
          python3 scripts/etl/overture_import.py --self-test

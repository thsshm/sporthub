name: Clean misclassified venues (#553)

# Soft-delete rétroactif des venues dont le nom contredit le sport (piscine/
# musculation/pêche/golf/boules taguées tennis/padel…). cleaning.is_misclassified.
# Dry-run par défaut. Secret : SUPABASE_DB_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Écrire réellement (sinon dry-run)"
        type: boolean
        required: false
        default: false

concurrency:
  group: clean-misclassified
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg2
        run: pip install psycopg2-binary --quiet
      - name: Run clean_misclassified.py
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          IN_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::secret SUPABASE_DB_PASSWORD manquant." >&2; exit 1
          fi
          if [ "${IN_APPLY}" = "true" ]; then
            python3 scripts/etl/clean_misclassified.py --apply
          else
            python3 scripts/etl/clean_misclassified.py
          fi

name: Backfill venue city_id

# Rattache les venues à leur ville (`city_id` = ville la plus proche ≤ 5 km).
# Débloque les pages programmatiques sport×ville (diagnostic 2026-06-08 : la
# plupart des venues ont city_id NULL → pages vides malgré des données présentes).
#
# Ne touche QUE les venues sans city_id (idempotent, conservateur).
# Dry-run par défaut ; --apply sur coche.
#
# Secrets requis (déjà configurés) : SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:
    inputs:
      max_km:
        description: "Rayon max de rattachement (km)"
        type: string
        required: false
        default: "5"
      limit:
        description: "Cap venues (smoke test ; vide = tout)"
        type: string
        required: false
        default: ""
      apply:
        description: "Écrire réellement en DB (sinon dry-run)"
        type: boolean
        required: false
        default: false
      diagnose:
        description: "Lecture seule : distribution city_id→slug (bbox/sport)"
        type: boolean
        required: false
        default: false
      bbox:
        description: "W,S,E,N pour le diagnostic"
        type: string
        required: false
        default: "4.81,45.74,4.87,45.79"
      sport:
        description: "primary_sport_slug pour le diagnostic"
        type: string
        required: false
        default: "tennis"

concurrency:
  group: backfill-venue-city
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: backfill_venue_city.py
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backfill_venue_city.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IN_MAXKM: ${{ inputs.max_km || '5' }}
          IN_LIMIT: ${{ inputs.limit || '' }}
          IN_APPLY: ${{ inputs.apply || 'false' }}
          IN_DIAGNOSE: ${{ inputs.diagnose || 'false' }}
          IN_BBOX: ${{ inputs.bbox || '4.81,45.74,4.87,45.79' }}
          IN_SPORT: ${{ inputs.sport || 'tennis' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY manquants." >&2
            exit 1
          fi
          if [ "$IN_DIAGNOSE" = "true" ]; then
            echo "▶ backfill_venue_city.py --diagnose --bbox $IN_BBOX --sport $IN_SPORT"
            python3 scripts/backfill_venue_city.py --diagnose --bbox "$IN_BBOX" --sport "$IN_SPORT"
            exit 0
          fi
          ARGS=(--max-km "$IN_MAXKM")
          [ -n "$IN_LIMIT" ] && ARGS+=(--limit "$IN_LIMIT")
          [ "$IN_APPLY" = "true" ] && ARGS+=(--apply)
          echo "▶ backfill_venue_city.py ${ARGS[*]}  (apply=$IN_APPLY)"
          python3 scripts/backfill_venue_city.py "${ARGS[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backfill venue → city_id"
            echo "- Rayon : ${{ inputs.max_km || '5' }} km"
            echo "- Mode : ${{ (inputs.apply == 'true') && 'APPLY (écriture réelle)' || 'DRY-RUN (aucune écriture)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
